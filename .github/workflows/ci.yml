name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Select affected components
        id: changes
        run: python3 scripts/changes.py
      - name: Validate workflow syntax and scan for secrets
        run: |
          bash scripts/tools.sh actionlint gitleaks
          export PATH="$RUNNER_TEMP/bin:$PATH"
          actionlint -color
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          gitleaks git . --log-opts=--all --redact --no-banner --config "$RUNNER_TEMP/gitleaks.toml" --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/no-ignored-secrets"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: 1.16.0, terraform_wrapper: false}
      - name: Validate Terraform and security boundaries without AWS credentials
        run: |
          terraform fmt -check -recursive infrastructure
          for root in bootstrap session; do
            terraform -chdir="infrastructure/$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infrastructure/$root" validate -no-color
            terraform -chdir="infrastructure/$root" test -no-color
          done
      - name: Validate delivery logic and render Kubernetes resources
        run: |
          bash scripts/tools.sh helm kubeconform
          export PATH="$RUNNER_TEMP/bin:$PATH"
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -m unittest discover -s tests -v
          python3 scripts/release.py
          python3 scripts/check_chart.py
      - name: Scan Terraform security with reviewed, expiring learning exceptions
        run: |
          bash scripts/tools.sh trivy
          export PATH="$RUNNER_TEMP/bin:$PATH"
          trivy config --config /dev/null --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1 infrastructure

  build:
    name: Image / ${{ matrix.component }}
    needs: checks
    if: needs.checks.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    uses: ./.github/workflows/image.yml
    with:
      component: ${{ matrix.component }}
      context: ${{ matrix.context }}
    permissions:
      contents: read
      id-token: write

  gate:
    name: Required checks
    if: always()
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require configuration success and successful or unnecessary image builds
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          test "$CHECKS" = success
          test "$BUILD" = success || test "$BUILD" = skipped

  proposal:
    name: Propose deployment
    needs: [checks, build, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true' && needs.checks.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-proposal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: 'release-*', path: records, merge-multiple: true}
      - name: Merge verified publisher records into current main
        env:
          SOURCE: ${{ github.sha }}
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          git fetch origin main
          # An older release must not replace a newer merged application change.
          git diff --quiet "$SOURCE" origin/main -- application .github/workflows scripts
          git checkout --detach origin/main
          python3 scripts/release.py --records records --source "$SOURCE" --account "$ACCOUNT" --region "$REGION"
      - name: Authenticate release App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Narx-Space-Prod
          repositories: commerce-aws
      - name: Open human-reviewed deployment PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE: ${{ github.sha }}
        run: |
          branch="release/$SOURCE"
          existing=$(gh pr list --head "$branch" --state all --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then printf 'Release PR already exists: %s\n' "$existing"; exit 0; fi
          git switch -c "$branch"
          git config user.name 'commerce-release[bot]'
          git config user.email 'commerce-release[bot]@users.noreply.github.com'
          git add deploy/release.json
          git diff --cached --quiet && exit 0
          git commit -m "Release Commerce $SOURCE"
          # Token through credential helper, never command-line arguments or persisted git config.
          gh auth setup-git
          git push origin "$branch"
          printf 'Deploy the tested, scanned and signed ECR image digests from source %s.\n\nReview the CI evidence and deployment diff before merging.\n' "$SOURCE" > "$RUNNER_TEMP/release-body.md"
          gh pr create --base main --head "$branch" --title "Release Commerce ${SOURCE:0:12}" --body-file "$RUNNER_TEMP/release-body.md"
