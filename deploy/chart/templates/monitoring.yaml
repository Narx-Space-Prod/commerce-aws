{{- if .Values.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: commerce
  labels: {release: monitoring}
spec:
  selector: {matchLabels: {app: commerce}}
  targetLabels: [component]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelings:
        - {sourceLabels: [__meta_kubernetes_service_label_component], regex: 'orders|publisher|worker', targetLabel: __metrics_path__, replacement: /actuator/prometheus}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: commerce
  labels: {release: monitoring}
spec:
  groups:
    - name: commerce
      rules:
        - alert: CommerceServiceDown
          expr: up{namespace="commerce"} == 0
          for: 2m
          labels: {severity: critical, project: commerce-aws}
          annotations: {summary: 'Commerce metrics endpoint is down'}
        - alert: CommerceDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="commerce"} < 1
          for: 3m
          labels: {severity: critical, project: commerce-aws}
          annotations: {summary: 'Commerce deployment has no ready replica'}
        - alert: CommerceHTTPErrorRate
          expr: '(sum(rate(http_server_requests_seconds_count{namespace="commerce",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{namespace="commerce"}[5m])), 0.001) > 0.05) and (sum(increase(http_server_requests_seconds_count{namespace="commerce"}[5m])) >= 20)'
          for: 5m
          labels: {severity: warning, project: commerce-aws}
          annotations: {summary: 'Commerce API error rate exceeds 5% with at least 20 requests'}
        - alert: CommerceOutboxStalled
          expr: commerce_outbox_oldest_seconds{namespace="commerce"} > 300
          for: 2m
          labels: {severity: critical, project: commerce-aws}
          annotations: {summary: 'An order event has not reached SQS for more than five minutes'}
        - alert: CommerceQueuePollingFailures
          expr: sum(increase(commerce_queue_poll_total{namespace="commerce",result="failed"}[5m])) > 5
          for: 2m
          labels: {severity: warning, project: commerce-aws}
          annotations: {summary: 'Receipt worker repeatedly fails to poll SQS'}
{{- end }}
