{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata: {name: commerce-redis}
spec:
  selector: {app: commerce, component: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: commerce-redis}
spec:
  serviceName: commerce-redis
  replicas: 1
  selector: {matchLabels: {app: commerce, component: redis}}
  template:
    metadata: {labels: {app: commerce, component: redis}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: [redis-server, --dir, /data, --appendonly, "yes", --maxmemory, 64mb, --maxmemory-policy, noeviction]
          ports: [{containerPort: 6379}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 10}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        storageClassName: gp3
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
{{- end }}
