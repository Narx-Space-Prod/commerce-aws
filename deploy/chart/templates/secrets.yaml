{{- if .Values.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-runtime
  annotations: {argocd.argoproj.io/sync-wave: '-2'}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: commerce-runtime
  annotations: {argocd.argoproj.io/sync-wave: '-2'}
spec:
  refreshInterval: 5m
  secretStoreRef: {name: aws-runtime, kind: SecretStore}
  target: {name: commerce-runtime, creationPolicy: Owner}
  dataFrom:
    - extract: {key: {{ required "runtimeSecretArn is required" .Values.runtimeSecretArn | quote }}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: commerce-db-admin
  annotations: {argocd.argoproj.io/sync-wave: '-2'}
spec:
  refreshInterval: 5m
  secretStoreRef: {name: aws-runtime, kind: SecretStore}
  target: {name: commerce-db-admin, creationPolicy: Owner}
  data:
    - secretKey: password
      remoteRef: {key: {{ required "databaseSecretArn is required" .Values.databaseSecretArn | quote }}, property: password}
{{- end }}
