crds:
  install: true
configs:
  params:
    server.insecure: false
  cm:
    timeout.reconciliation: 120s
server:
  service: {type: ClusterIP}
  resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 192Mi}}
controller:
  resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {memory: 512Mi}}
repoServer:
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 384Mi}}
applicationSet: {enabled: false}
notifications: {enabled: false}
dex: {enabled: false}
redis:
  resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {memory: 128Mi}}
