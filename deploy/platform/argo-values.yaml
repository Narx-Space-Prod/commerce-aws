crds:
  install: true
configs:
  params:
    server.insecure: false
  cm:
    timeout.reconciliation: 120s
    application.resourceTrackingMethod: annotation
    resource.customizations.health.argoproj.io_Application: |
      hs = {status = "Progressing", message = "Waiting for child Application health"}
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
      end
      return hs
  repositories:
    cert-manager-oci:
      type: helm
      url: quay.io/jetstack/charts
      enableOCI: 'true'
server:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi
controller:
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
applicationSet:
  enabled: false
notifications:
  enabled: false
dex:
  enabled: false
redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
