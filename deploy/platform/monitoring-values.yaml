# One-node session profile. Administrative endpoints are ClusterIP / port-forward only.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence: {enabled: true, storageClassName: gp3, size: 2Gi}
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 384Mi}}
prometheus:
  prometheusSpec:
    retention: 6h
    retentionSize: 2GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 768Mi}}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 5Gi}}
alertmanager:
  alertmanagerSpec:
    resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 192Mi}}
    secrets: [slack-notifications]
  config:
    global: {resolve_timeout: 5m}
    route:
      receiver: 'null'
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: 'null'
          matchers: ['alertname = Watchdog']
        - receiver: slack
          matchers: ['severity =~ "warning|critical"']
    receivers:
      - name: 'null'
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-notifications/webhook
            send_resolved: true
            title: 'Commerce AWS: {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity = warning']
        equal: [namespace, alertname]

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true
